# Deploy spacegho.st/tools: `wrangler deploy` uploads public/ as Static Assets for
# the routes in wrangler.toml. There is no Worker script.
#
#   * `environment: cloudflare` is the only place the API token exists.
#   * the fork gate keeps a fork's copy of this file away from the owner's account.
#   * a missing secret fails the job with a message instead of deploying.
name: Deploy

on:
  push:
    branches: [master]
    paths: ['public/**', 'wrangler.toml', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository_owner == 'Spaceghost' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    environment: cloudflare
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the environment is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing="$missing vars.CLOUDFLARE_ACCOUNT_ID"
          if [[ -n "$missing" ]]; then
            echo "::error::the 'cloudflare' environment is missing:$missing (see README, Deploying). Nothing was deployed."
            exit 1
          fi
      - run: scripts/check.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 deploy

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every page answers 200
        run: |
          for p in /tools/ /tools/romsort/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://spacegho.st$p")
            echo "$p $code"; [ "$code" = 200 ]
          done
