name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/check.sh
      - name: Wrangler dry run
        run: npx --yes wrangler@4.135.0 deploy --dry-run
